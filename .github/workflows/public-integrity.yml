name: Public Integrity

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "status.json"
      - ".github/workflows/public-integrity.yml"
      - "backend/**"
      - "frontend/**"
      - "mobile/**"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "status.json"
      - ".github/workflows/public-integrity.yml"
      - "backend/**"
      - "frontend/**"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-integrity:
    name: Public Showcase Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate public files
        shell: python
        run: |
          import json
          import pathlib
          import re

          required = [
              pathlib.Path("README.md"),
              pathlib.Path("docs/ARCHITECTURE.md"),
              pathlib.Path("docs/DEVELOPERS.md"),
              pathlib.Path("docs/ROADMAP.md"),
              pathlib.Path("docs/SECURITY.md"),
              pathlib.Path("status.json"),
          ]

          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing required public files: " + ", ".join(missing))

          status = json.loads(pathlib.Path("status.json").read_text(encoding="utf-8"))
          if status.get("repositoryRole") != "public-showcase":
              raise SystemExit("status.json repositoryRole must be public-showcase")
          if status.get("sourceOfTruth") != "AmirMotefaker/LinkResan-Production":
              raise SystemExit("status.json sourceOfTruth is invalid")

          public_files = [
              pathlib.Path("README.md"),
              pathlib.Path("status.json"),
              *pathlib.Path("docs").rglob("*.md"),
          ]

          patterns = {
              "private key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "GitHub token": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}\b"),
              "OpenAI-style secret": re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b"),
              "JWT-like bearer": re.compile(r"\beyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b"),
          }

          for path in public_files:
              text = path.read_text(encoding="utf-8", errors="strict")
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      raise SystemExit(f"Possible {label} found in {path}")

          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          required_readme_markers = [
              "AmirMotefaker/LinkResan-Production",
              "Public / Private boundary",
              "پرداخت رمزارزی",
              "Not shipped",
          ]
          for marker in required_readme_markers:
              if marker not in readme:
                  raise SystemExit(f"README missing required marker: {marker}")

          print("Public showcase content validation passed.")

      - name: Ensure this PR is public-showcase scope only
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-status "origin/${{ github.base_ref }}...HEAD" > /tmp/public-diff.txt
          cat /tmp/public-diff.txt

          while IFS=$'\t' read -r status file rest; do
            [ -z "${status:-}" ] && continue
            case "$file" in
              README.md|status.json|docs/*|.github/workflows/public-integrity.yml)
                ;;
              backend/*|frontend/*|mobile/*)
                case "$status" in
                  D*) ;;
                  *)
                    echo "Runtime path may only be deleted during public-showcase cleanup: $status $file"
                    exit 1
                    ;;
                esac
                ;;
              *)
                echo "Non-showcase file changed: $status $file"
                echo "Failing closed: unsupported public repository scope."
                exit 1
                ;;
            esac
          done < /tmp/public-diff.txt

          echo "Public-showcase scope allowlist passed."

      - name: Require legacy runtime directories to stay absent
        shell: bash
        run: |
          set -euo pipefail
          for dir in backend frontend mobile; do
            if [ -e "$dir" ]; then
              if [ "${{ github.event_name }}" = "pull_request" ]; then
                if git diff --name-status "origin/${{ github.base_ref }}...HEAD" | awk -v prefix="$dir/" '$1 !~ /^D/ && index($2, prefix) == 1 { found=1 } END { exit found ? 0 : 1 }'; then
                  echo "Non-deletion runtime content remains or was introduced under $dir/."
                  exit 1
                fi
              else
                echo "Legacy runtime directory must not exist on public main: $dir/"
                exit 1
              fi
            fi
          done

          echo "Legacy runtime directory guard passed."
